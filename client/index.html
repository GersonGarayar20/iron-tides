<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Tides</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #05151f;
        overflow: hidden;
        font-family: monospace;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }

      #auth-gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05151f;
        z-index: 1000;
      }
      .auth-card {
        width: 280px;
        padding: 24px;
        background: #0c1f2b;
        border: 1px solid #1f3b4a;
        border-radius: 8px;
        color: #eaffff;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .auth-card h1 {
        margin: 0 0 8px;
        font-size: 18px;
        text-align: center;
        color: #4fd8ff;
      }
      .auth-card input, .auth-card button {
        font-family: monospace;
        font-size: 13px;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #1f3b4a;
      }
      .auth-card input {
        background: #05151f;
        color: #eaffff;
      }
      .auth-card button {
        background: #1f3b4a;
        color: #eaffff;
        cursor: pointer;
      }
      .auth-card button:hover {
        background: #2a4f63;
      }
      .auth-divider {
        text-align: center;
        color: #6b7d85;
        font-size: 11px;
      }
      .auth-actions {
        display: flex;
        gap: 8px;
      }
      .auth-actions button {
        flex: 1;
      }
      .auth-error {
        min-height: 14px;
        color: #ff7a6b;
        font-size: 11px;
        text-align: center;
      }

      #dock-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 21, 31, 0.7);
        z-index: 900;
      }
      #dock-backdrop.hidden {
        display: none;
      }
      #dock-panel {
        position: relative;
        width: 480px;
        max-width: 92vw;
        max-height: 80vh;
        overflow-y: auto;
        padding-top: 26px;
        background: #0c1f2bee;
        border: 1px solid #1f3b4a;
        border-radius: 8px;
        color: #eaffff;
        font-size: 12px;
        box-shadow: 0 8px 32px #000a;
      }
      #dock-panel .dock-close {
        position: absolute;
        top: 2px;
        right: 6px;
        background: none;
        border: none;
        color: #6b7d85;
        font-size: 20px;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
        z-index: 1;
      }
      #dock-panel .dock-close:hover {
        color: #eaffff;
      }
      #dock-panel .dock-tabs {
        display: flex;
        border-bottom: 1px solid #1f3b4a;
      }
      #dock-panel .dock-tabs button {
        flex: 1;
        padding: 8px 2px;
        background: none;
        border: none;
        color: #6b7d85;
        font-family: monospace;
        font-size: 11px;
        cursor: pointer;
      }
      #dock-panel .dock-tabs button.active {
        color: #4fd8ff;
        border-bottom: 2px solid #4fd8ff;
      }
      #dock-panel .dock-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #dock-panel .dock-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #132833;
      }
      #dock-panel button.dock-action {
        background: #1f3b4a;
        color: #eaffff;
        border: 1px solid #2a4f63;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #dock-panel button.dock-action:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #dock-panel button.dock-action:hover:not(:disabled) {
        background: #2a4f63;
      }
      #dock-panel .dock-row-locked {
        opacity: 0.5;
      }
      #dock-hint {
        position: fixed;
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        color: #8fd8ff;
        font-size: 12px;
        z-index: 400;
        text-shadow: 0 1px 2px #000;
      }
      #dock-hint.hidden {
        display: none;
      }
      #account-corner {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 400;
      }
      #account-corner button {
        background: #0c1f2bee;
        color: #eaffff;
        border: 1px solid #1f3b4a;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        padding: 6px 10px;
        cursor: pointer;
      }

      /* Phase 6: chat panel — always visible, bottom-left. */
      #chat-panel {
        position: fixed;
        bottom: 16px;
        left: 16px;
        width: 300px;
        background: #0c1f2bee;
        border: 1px solid #1f3b4a;
        border-radius: 8px;
        color: #eaffff;
        font-size: 11px;
        z-index: 450;
      }
      #chat-panel .chat-tabs {
        display: flex;
        border-bottom: 1px solid #1f3b4a;
      }
      #chat-panel .chat-tabs button {
        flex: 1;
        padding: 6px 2px;
        background: none;
        border: none;
        color: #6b7d85;
        font-family: monospace;
        font-size: 11px;
        cursor: pointer;
      }
      #chat-panel .chat-tabs button.active {
        color: #4fd8ff;
        border-bottom: 2px solid #4fd8ff;
      }
      #chat-panel .chat-messages {
        height: 120px;
        overflow-y: auto;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #chat-panel .chat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        word-break: break-word;
      }
      #chat-panel .chat-row-actions button {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 10px;
        opacity: 0.6;
      }
      #chat-panel .chat-row-actions button:hover {
        opacity: 1;
      }
      #chat-panel .chat-form {
        display: flex;
        border-top: 1px solid #1f3b4a;
      }
      #chat-panel .chat-input {
        flex: 1;
        background: #05151f;
        color: #eaffff;
        border: none;
        padding: 6px 8px;
        font-family: monospace;
        font-size: 11px;
      }
      #chat-panel .chat-form button {
        background: #1f3b4a;
        color: #eaffff;
        border: none;
        font-family: monospace;
        font-size: 11px;
        padding: 6px 10px;
        cursor: pointer;
      }

      /* Phase 6: social panel (groups/clans/nearby players) — toggled with N. */
      #social-panel {
        position: fixed;
        bottom: 16px;
        left: 332px;
        width: 300px;
        max-height: 70vh;
        overflow-y: auto;
        background: #0c1f2bee;
        border: 1px solid #1f3b4a;
        border-radius: 8px;
        color: #eaffff;
        font-size: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 450;
      }
      #social-panel.hidden {
        display: none;
      }
      #social-panel input {
        font-family: monospace;
        font-size: 11px;
        padding: 4px;
        border-radius: 4px;
        border: 1px solid #1f3b4a;
        background: #05151f;
        color: #eaffff;
      }

      /* Phase 7 (third slice): mobile/touch controls — only ever created by
         touchControls.ts on a touch-capable device, never on desktop. The
         wrapper ignores pointer events so it never blocks canvas taps
         between the two corners; each child opts back in. */
      #touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 600;
      }
      #touch-joystick-base {
        position: absolute;
        left: 20px;
        bottom: 16px;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: #0c1f2b66;
        border: 2px solid #1f3b4a;
        pointer-events: auto;
        touch-action: none;
      }
      #touch-joystick-thumb {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin-left: -26px;
        margin-top: -26px;
        border-radius: 50%;
        background: #1f3b4acc;
        border: 2px solid #4fd8ff;
        pointer-events: none;
      }
      #touch-fire-buttons {
        position: absolute;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #touch-fire-buttons button {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #1f3b4acc;
        color: #eaffff;
        border: 2px solid #2a4f63;
        font-family: monospace;
        font-size: 10px;
        pointer-events: auto;
        touch-action: none;
        cursor: pointer;
      }
      #touch-fire-buttons button:active {
        background: #2a4f63cc;
      }

      /* Landscape phones are short on height — shrink the controls a touch
         so they stay comfortably on-screen without eating more of an
         already-short viewport. */
      @media (orientation: landscape) and (max-height: 500px) {
        #touch-joystick-base {
          width: 92px;
          height: 92px;
        }
        #touch-joystick-thumb {
          width: 44px;
          height: 44px;
          margin-left: -22px;
          margin-top: -22px;
        }
        #touch-fire-buttons button {
          width: 56px;
          height: 56px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
